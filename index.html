<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kit GTM na Prática</title>
<meta name="description" content="Material complementar da Aula 1 da trilha Construção de Máquina de Vendas B2B da PipeLovers: monte o GTM da sua empresa em 10 passos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra de marca navy fixa; trilha de passos à esquerda; uma tarefa por tela no centro; resumo de 1 página no fim. */
:root{
  --bg:#F4F5FC; --surface:#FFFFFF; --surface-2:#EEF0FA; --ink:#0B1030; --muted:#565D80; --line:#D7DCF3;
  --accent:#3F57E6; --accent-2:#8093FF; --accent-soft:#E3E7FF; --on-accent:#FFFFFF;
  --navy:#0B1030; --navy-2:#141B45; --on-navy:#EEF0FA; --on-navy-muted:#9AA3C8;
  --good:#17845A; --good-soft:#DDF3E9; --warn:#A8650A; --warn-soft:#FBEBD2; --bad:#C23A50; --bad-soft:#F9DEE3;
  --ring-1:#C9D2F5; --ring-2:#8093FF; --ring-3:#3F57E6;
  --f-display:"Bebas Neue", "Oswald", Impact, "Arial Narrow", sans-serif;
  --f-body:"Poppins", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"Roboto Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --gut:clamp(16px,4vw,32px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A0E28; --surface:#121838; --surface-2:#19204A; --ink:#EEF0FA; --muted:#A3AACB; --line:#2A3470;
  --accent:#8093FF; --accent-2:#A9B6FF; --accent-soft:#222C68; --on-accent:#0B1030;
  --navy:#060918; --navy-2:#121838; --on-navy:#EEF0FA; --on-navy-muted:#9AA3C8;
  --good:#4CC995; --good-soft:#123528; --warn:#F0B35A; --warn-soft:#3A2A10; --bad:#F27A8E; --bad-soft:#3D1A22;
  --ring-1:#2A3470; --ring-2:#4F68EE; --ring-3:#8093FF; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A0E28; --surface:#121838; --surface-2:#19204A; --ink:#EEF0FA; --muted:#A3AACB; --line:#2A3470;
  --accent:#8093FF; --accent-2:#A9B6FF; --accent-soft:#222C68; --on-accent:#0B1030;
  --navy:#060918; --navy-2:#121838; --on-navy:#EEF0FA; --on-navy-muted:#9AA3C8;
  --good:#4CC995; --good-soft:#123528; --warn:#F0B35A; --warn-soft:#3A2A10; --bad:#F27A8E; --bad-soft:#3D1A22;
  --ring-1:#2A3470; --ring-2:#4F68EE; --ring-3:#8093FF; color-scheme:dark }

*{box-sizing:border-box}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
body{margin:0; background:var(--bg); color:var(--ink); font:400 15px/1.6 var(--f-body); -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{text-wrap:balance; margin:0}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent-2); outline-offset:2px; border-radius:6px}
.eyebrow{font:600 12px/1.2 var(--f-body); letter-spacing:.14em; text-transform:uppercase; color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:13px}
.label{font:600 12px/1.2 var(--f-body); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.src{font-size:12px; color:var(--muted)}

/* TOPO */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--navy); color:var(--on-navy)}
.top-in{max-width:1220px; margin:0 auto; padding-inline:var(--gut); padding-block:10px; display:flex; align-items:center; gap:14px}
.top img{height:24px; width:auto; display:block}
.top .ttl{font:400 22px/1 var(--f-display); letter-spacing:.03em; white-space:nowrap}
.top .ttl span{color:var(--accent-2)}
.top .sub{font-size:12px; color:var(--on-navy-muted); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.top .bar{position:absolute; left:0; bottom:0; height:3px; background:var(--accent-2); transition:width .35s}
@media (max-width:640px){ .top .sub{display:none} .top .ttl{flex:1} }

.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:8px; padding:9px 14px; font-weight:500; font-size:14px; cursor:pointer; text-decoration:none; white-space:nowrap; transition:border-color .15s, background .15s, filter .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px; font-size:12.5px}
.btn.big{padding:12px 20px; font-size:15px}
.btn.danger{color:var(--bad); border-color:var(--bad)}
.btn.danger.armed{background:var(--bad); color:#fff}
.btn[disabled]{opacity:.4; cursor:not-allowed}
.btn svg{width:16px; height:16px; flex-shrink:0}
.top .btn{background:transparent; color:var(--on-navy); border-color:rgba(154,163,200,.4)}
.top .btn:hover{border-color:var(--accent-2)}
.menu{position:relative}
.menu-pop{position:absolute; right:0; top:calc(100% + 8px); background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:6px; width:270px; box-shadow:0 14px 34px rgba(11,16,48,.25); z-index:40}
.menu-pop button{display:block; width:100%; text-align:left; border:0; background:none; padding:9px 10px; border-radius:6px; cursor:pointer; font-size:13.5px}
.menu-pop button:hover{background:var(--surface-2)}
.menu-pop button small{display:block; color:var(--muted); font-size:12px}
.menu-pop hr{border:0; border-top:1px solid var(--line); margin:4px 0}
@media (max-width:640px){ .top .lbl{display:none} }

/* APP */
.app{max-width:1220px; margin:0 auto; padding-inline:var(--gut); padding-block:28px 64px; display:grid; grid-template-columns:250px minmax(0,1fr); gap:28px; align-items:start}
@media (max-width:920px){ .app{grid-template-columns:minmax(0,1fr); gap:14px; padding-block:14px 48px} }

/* TRILHA */
.trail{position:sticky; top:70px}
.trail-toggle{display:none}
#stage:focus{outline:none}
.trail-toggle > span:last-child{white-space:nowrap}
.trail ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px}
.trail li button{width:100%; display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:10px; align-items:center; text-align:left; border:0; background:none; padding:8px 10px; border-radius:9px; cursor:pointer; color:var(--muted); font-size:14px}
.trail li button:hover{background:var(--surface-2); color:var(--ink)}
.trail li button[aria-current="step"]{background:var(--surface); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); font-weight:600}
.trail .num{width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font:500 12px/1 var(--f-mono); background:var(--surface-2); color:var(--muted)}
.trail button[aria-current="step"] .num{background:var(--accent); color:var(--on-accent)}
.trail .st{width:9px; height:9px; border-radius:50%; background:transparent}
.trail .st.s1{background:var(--warn)} .trail .st.s2{background:var(--good)}
.trail .group{font:600 11px/1 var(--f-body); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); padding:14px 10px 6px}
.trail .legend{display:flex; gap:12px; font-size:11.5px; color:var(--muted); padding:14px 10px 0}
.trail .legend span{display:inline-flex; align-items:center; gap:5px}
.trail .legend i{width:8px; height:8px; border-radius:50%; display:inline-block}
@media (max-width:920px){
  .trail{position:static}
  .trail-toggle{display:flex; width:100%; justify-content:space-between; align-items:center; gap:10px; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:11px 14px; cursor:pointer; font-size:14px; text-align:left}
  .trail-toggle b{font-weight:600}
  .trail-list{display:none; margin-top:8px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:6px}
  .trail.open .trail-list{display:block}
}

/* PASSO */
.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:clamp(18px,3.4vw,36px); min-width:0}
.s-head{display:flex; flex-direction:column; gap:10px; margin-bottom:24px}
.s-meta{display:flex; align-items:center; gap:12px}
.s-meta .eyebrow{white-space:nowrap}
.prog{flex:1; height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden}
.prog i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .35s}
.s-head h2{font:400 clamp(38px,5.4vw,58px)/.95 var(--f-display); letter-spacing:.01em}
.why{font-size:15.5px; color:var(--muted); max-width:66ch}
.todo{display:flex; flex-direction:column; gap:6px; background:var(--accent-soft); border-radius:12px; padding:14px 16px; margin-top:6px; max-width:760px}
.todo b{font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent)}
.todo ol{margin:0; padding-left:20px; font-size:14.5px}
.todo li{padding:1px 0}
.s-body{display:flex; flex-direction:column; gap:16px}
.s-nav{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:30px; padding-top:20px; border-top:1px solid var(--line); flex-wrap:wrap}
.s-nav .saved{font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:6px}
.s-nav .saved::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--good)}
@media (max-width:560px){ .s-nav{flex-direction:column-reverse; align-items:stretch} .s-nav .btn{width:100%} .s-nav .saved{justify-content:center} }

/* CAMPOS */
.fld{display:flex; flex-direction:column; gap:5px; min-width:0}
.fld > label{font-size:14px; font-weight:600}
.fld > label small{font-weight:400; color:var(--muted); font-size:12.5px}
.hint{font-size:12.5px; color:var(--muted)}
textarea,input[type=text],input[type=number],input[type=date],select{width:100%; border:1px solid var(--line); background:var(--bg); border-radius:9px; padding:10px 12px; font-size:14.5px; line-height:1.45; transition:border-color .15s, background .15s}
textarea{resize:vertical; min-height:72px}
textarea:focus,input:focus,select:focus{outline:none; border-color:var(--accent); background:var(--surface)}
::placeholder{color:var(--muted); opacity:.75}
.g2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
.g3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
.g4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
@media (max-width:760px){ .g2,.g3{grid-template-columns:minmax(0,1fr)} .g4{grid-template-columns:repeat(2,minmax(0,1fr))} }
.box-accent{border:1px dashed var(--accent); background:var(--accent-soft); border-radius:12px; padding:12px}
.box-bad{border:1px dashed var(--bad); background:var(--bad-soft); border-radius:12px; padding:12px}
.box-bad > label{color:var(--bad)}
.chk{display:flex; gap:9px; align-items:flex-start; font-size:14px; cursor:pointer}
.chk input{margin-top:4px; accent-color:var(--accent); width:16px; height:16px; flex-shrink:0}

/* ESCOLHAS */
.pick{display:grid; gap:10px}
.pick.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){ .pick.c4{grid-template-columns:repeat(2,minmax(0,1fr))} }
.opt{border:1px solid var(--line); background:var(--bg); border-radius:12px; padding:14px; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:4px; transition:border-color .15s}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent)}
.opt .n{font:400 30px/1 var(--f-display); color:var(--accent)}
.opt .t{font-weight:600; font-size:15px}
.opt .m{font-size:12.5px; color:var(--muted)}

/* DIAGNÓSTICO */
.pills{display:flex; flex-wrap:wrap; gap:6px}
.pill{border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px}
.pill[aria-current="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.pill .c{font:500 11px/1 var(--f-mono); opacity:.7}
.q{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px 18px; align-items:center; padding:14px 0; border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:0}
.q p{font-size:15px}
.seg{display:inline-flex; background:var(--surface-2); border-radius:9px; padding:3px; gap:2px}
.seg button{border:0; background:transparent; padding:7px 13px; border-radius:7px; font-size:13.5px; font-weight:500; cursor:pointer; color:var(--muted)}
.seg button[aria-pressed="true"][data-v="2"]{background:var(--good); color:#fff}
.seg button[aria-pressed="true"][data-v="1"]{background:var(--warn); color:#fff}
.seg button[aria-pressed="true"][data-v="0"]{background:var(--bad); color:#fff}
@media (max-width:600px){ .q{grid-template-columns:minmax(0,1fr)} }
.result{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; align-items:start}
@media (max-width:760px){ .result{grid-template-columns:minmax(0,1fr)} }
.gauge{display:flex; align-items:center; gap:18px}
.gauge svg{width:124px; height:124px; flex-shrink:0}
.gauge .lvl{font:400 34px/1 var(--f-display); letter-spacing:.02em}
.gauge .lvl-d{font-size:14px; color:var(--muted); margin-top:6px}
.levels{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; font-size:11.5px; line-height:1.3; margin-top:16px}
.levels div{border-top:3px solid var(--line); padding-top:6px; color:var(--muted)}
.levels div.on{border-color:var(--accent); color:var(--ink)}
.levels b{display:block; font-weight:600}
.bars{display:flex; flex-direction:column; gap:10px}
.bar{display:grid; grid-template-columns:96px minmax(0,1fr) 40px; gap:10px; align-items:center; font-size:13.5px}
.bar .track{height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden}
.bar .fill{height:100%; border-radius:99px}
.bar .v{font:500 12px/1 var(--f-mono); text-align:right; color:var(--muted)}
.focus{background:var(--accent-soft); border-radius:12px; padding:14px 16px; font-size:14px}
.focus ol{margin:6px 0 0; padding-left:18px}
.focus button{border:0; background:none; padding:0; color:var(--accent); font-weight:600; text-decoration:underline; cursor:pointer}

/* JORNADA */
.tabs{display:flex; gap:6px; flex-wrap:wrap}
.tab{border:1px solid var(--line); background:var(--bg); border-radius:9px; padding:8px 12px; font-size:13.5px; cursor:pointer; display:flex; align-items:center; gap:7px}
.tab[aria-selected="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.tab.add{border-style:dashed; color:var(--accent)}
.dot{width:8px; height:8px; border-radius:50%; background:var(--line)}
.dot.half{background:var(--warn)} .dot.full{background:var(--good)}
.jor-head{display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end}
.jor-head .fld{flex:1 1 260px}
.jor-head .acts{display:flex; gap:6px; flex-wrap:wrap}
.jor-foot{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}

/* MOTOR */
.motors{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px}
.motor{border:1px solid var(--line); border-radius:12px; padding:12px; background:var(--bg); display:flex; flex-direction:column; gap:4px; min-width:0}
.motor .t{font:400 23px/1 var(--f-display); letter-spacing:.02em}
.motor .d{font-size:12.5px; color:var(--muted); line-height:1.4}
.motor select{margin-top:auto; padding:7px 9px; font-size:13.5px; font-weight:500}
.motor .sel{margin-top:auto; padding-top:8px}
.motor[data-s="1"]{border-color:var(--accent); background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent)}
.motor[data-s="2"]{border-color:var(--accent-2); border-style:dashed}

/* CANAIS */
.mix{font-size:15px; padding:12px 14px; border-left:3px solid var(--accent); background:var(--surface-2); border-radius:0 10px 10px 0}
.bull{display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:22px; align-items:start}
@media (max-width:1000px){ .bull{grid-template-columns:minmax(0,1fr)} }
.ch{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 12px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line)}
.ch:last-child{border-bottom:0}
.ch .nm{font-size:14px; font-weight:500}
.ch .nm small{display:block; font-weight:400; font-size:11.5px; color:var(--muted)}
.ch input{padding:7px 10px; font-size:13.5px; grid-column:1/-1}
.ring-seg{display:inline-flex; background:var(--surface-2); border-radius:8px; padding:3px; gap:2px}
.ring-seg button{border:0; background:transparent; padding:5px 8px; border-radius:6px; font-size:12px; font-weight:500; cursor:pointer; color:var(--muted)}
.ring-seg button[aria-pressed="true"][data-r="1"]{background:var(--ring-1); color:var(--ink)}
.ring-seg button[aria-pressed="true"][data-r="2"]{background:var(--ring-2); color:#fff}
.ring-seg button[aria-pressed="true"][data-r="3"]{background:var(--ring-3); color:var(--on-accent)}
.target svg{width:100%; max-width:260px; height:auto; display:block; margin:0 auto}
.rings-list{display:flex; flex-direction:column; gap:10px; margin-top:14px; font-size:13px}
.rings-list .h{font-weight:600; display:flex; align-items:center; gap:8px}
.rings-list .sw{width:12px; height:12px; border-radius:3px; display:inline-block}
.rings-list .v{color:var(--muted)}
.warn{color:var(--warn); font-size:12.5px; font-weight:500}
.ring-steps{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
@media (max-width:700px){ .ring-steps{grid-template-columns:minmax(0,1fr)} }
.ring-steps div{background:var(--surface-2); border-radius:10px; padding:10px 12px; font-size:13px}
.ring-steps b{display:block; font-size:14px}
.ice-wrap{overflow-x:auto}
table.ice{width:100%; border-collapse:collapse; font-size:14px; min-width:540px}
table.ice th{font:600 12px/1.2 var(--f-body); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); text-align:left; padding:8px 6px; border-bottom:1px solid var(--line)}
table.ice th.c, table.ice td.c{text-align:center}
table.ice td{padding:6px; border-bottom:1px solid var(--line); vertical-align:middle}
table.ice input[type=number]{width:62px; text-align:center; font-family:var(--f-mono); padding:7px}
table.ice .sc{font:400 28px/1 var(--f-display); font-variant-numeric:tabular-nums; color:var(--accent)}
table.ice tr.first .sc::after{content:"testar primeiro"; display:block; font:600 10px/1.2 var(--f-body); letter-spacing:.06em; text-transform:uppercase; color:var(--good); margin-top:2px}
.x{border:0; background:none; cursor:pointer; color:var(--muted); font-size:18px; line-height:1; padding:4px 8px; border-radius:6px}
.x:hover{color:var(--bad); background:var(--bad-soft)}
.row-btns{display:flex; gap:8px; flex-wrap:wrap}

/* METAS */
.calc-out{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
@media (max-width:560px){ .calc-out{grid-template-columns:minmax(0,1fr)} }
.calc-out div{background:var(--surface-2); border-radius:12px; padding:14px 16px}
.calc-out .big{font:400 40px/1 var(--f-display); color:var(--accent); font-variant-numeric:tabular-nums; margin:4px 0}
.calc-out .lab{font-size:12.5px; color:var(--muted)}
details.more{border:1px solid var(--line); border-radius:12px; padding:12px 14px}
details.more summary{cursor:pointer; font-weight:600; font-size:14px}
.gloss{display:grid; grid-template-columns:120px minmax(0,1fr); gap:6px 12px; font-size:13.5px; margin-top:10px}

/* IA */
details.ai{border:1px solid var(--accent-2); border-radius:14px; background:linear-gradient(180deg, var(--accent-soft), var(--surface) 80%); margin-top:6px}
details.ai > summary{list-style:none; cursor:pointer; padding:14px 18px; display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px}
details.ai > summary::-webkit-details-marker{display:none}
details.ai > summary .eyebrow{display:inline-flex; align-items:center; gap:6px}
details.ai > summary .open-l{margin-left:auto; font-size:13px; color:var(--accent); font-weight:500}
details.ai[open] > summary .open-l::after{content:" ▲"} details.ai:not([open]) > summary .open-l::after{content:" ▼"}
.ai-in{padding:0 18px 18px; display:flex; flex-direction:column; gap:10px}
.ai-in p{font-size:14px; color:var(--muted); max-width:74ch}
.prompt{position:relative}
.prompt pre{margin:0; white-space:pre-wrap; word-break:break-word; background:var(--navy); color:var(--on-navy); font:400 12.5px/1.6 var(--f-mono); padding:16px; padding-right:96px; border-radius:10px; max-height:280px; overflow:auto}
.prompt .copy{position:absolute; top:8px; right:8px}
.chips{display:flex; flex-direction:column; gap:8px}
.chip{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:9px 12px; font-size:13.5px; cursor:pointer; text-align:left}
.chip:hover{border-color:var(--accent)}

/* INÍCIO */
.welcome{background:var(--navy); color:var(--on-navy); border-radius:16px; padding:clamp(22px,4vw,44px); position:relative; overflow:hidden}
.welcome::after{content:""; position:absolute; right:-120px; top:-140px; width:440px; height:440px; border-radius:50%; background:radial-gradient(circle, transparent 0 34%, rgba(128,147,255,.16) 34% 35%, transparent 35% 52%, rgba(128,147,255,.12) 52% 53%, transparent 53% 70%, rgba(128,147,255,.08) 70% 71%, transparent 71%); pointer-events:none}
.welcome h1{font:400 clamp(52px,8vw,92px)/.9 var(--f-display); position:relative}
.welcome h1 span{color:var(--accent-2)}
.welcome p.lede{font-size:16.5px; max-width:58ch; margin-top:14px; opacity:.92; position:relative}
.welcome .who{font-size:13px; color:var(--on-navy-muted); margin-top:14px}
.welcome .who b{color:var(--on-navy)}
.gets{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
@media (max-width:760px){ .gets{grid-template-columns:minmax(0,1fr)} }
.gets div{border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--bg)}
.gets b{display:block; font-size:15px}
.gets span{font-size:13px; color:var(--muted)}
.map{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; counter-reset:m}
@media (max-width:760px){ .map{grid-template-columns:repeat(2,minmax(0,1fr))} }
.map button{border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:10px; text-align:left; cursor:pointer; font-size:13px}
.map button:hover{border-color:var(--accent)}
.map .n{font:400 22px/1 var(--f-display); color:var(--accent); display:block}

/* RESUMO / FOLHA */
.done-bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.sheet{border:1px solid var(--line); border-radius:14px; padding:clamp(14px,2.6vw,26px); background:var(--surface)}
.sh-top{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:10px; margin-bottom:14px}
.sh-top h3{font:400 clamp(30px,4vw,42px)/1 var(--f-display)}
.sh-top .meta{font-size:11.5px; color:var(--muted); text-align:right}
.sh-grid{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:10px}
.sh{border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-width:0}
.sh h4{font:400 19px/1 var(--f-display); letter-spacing:.03em; color:var(--accent); margin-bottom:6px; display:flex; justify-content:space-between; gap:8px}
.sh h4 small{font:500 10.5px/1.2 var(--f-body); color:var(--muted); letter-spacing:0; text-transform:none}
.sh .kv{display:grid; grid-template-columns:120px minmax(0,1fr); gap:3px 8px; font-size:12.5px; line-height:1.4}
.sh .kv dt{font-weight:600}
.sh .kv dd{margin:0; white-space:pre-wrap; word-break:break-word}
.sh p, .sh li{font-size:12.5px; line-height:1.45; white-space:pre-wrap}
.sh ul{margin:0; padding-left:16px}
.sh .empty{color:var(--muted); font-style:italic}
.s4{grid-column:span 4} .s6{grid-column:span 6} .s8{grid-column:span 8} .s12{grid-column:span 12}
@media (max-width:820px){ .s4,.s6,.s8{grid-column:span 12} }
.jt-wrap{overflow-x:auto}
table.jt{width:100%; border-collapse:collapse; font-size:11.5px; line-height:1.35; min-width:640px}
table.jt th, table.jt td{border:1px solid var(--line); padding:5px 6px; vertical-align:top; text-align:left; white-space:pre-wrap; word-break:break-word}
table.jt thead th{background:var(--surface-2); font-weight:600}
table.jt tbody th{font-weight:600; width:118px; background:var(--surface-2)}
.minibars{display:flex; flex-direction:column; gap:4px; font-size:11.5px}
.minibars div{display:grid; grid-template-columns:78px minmax(0,1fr) 30px; gap:6px; align-items:center}
.minibars i{display:block; height:6px; border-radius:99px; background:var(--surface-2); position:relative; overflow:hidden}
.minibars i b{position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:99px}
.bignum{font:400 30px/1 var(--f-display); color:var(--accent)}
.next-act{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 24px}
@media (max-width:760px){ .next-act{grid-template-columns:minmax(0,1fr)} }
.next-act h4{font:600 12px/1.2 var(--f-body); letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:4px}
.next-act label{display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; cursor:pointer}
.next-act input{accent-color:var(--accent); width:17px; height:17px; margin-top:3px; flex-shrink:0}
.next-act input:checked + span{text-decoration:line-through; opacity:.6}
.levels-ai{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
@media (max-width:860px){ .levels-ai{grid-template-columns:minmax(0,1fr)} }
.lv{border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:6px; background:var(--bg)}
.lv.rec{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.lv .n{font:500 12px/1 var(--f-mono); color:var(--accent)}
.lv h3{font:400 24px/1 var(--f-display); letter-spacing:.02em}
.lv p{font-size:13px; color:var(--muted)}
.steps-list{counter-reset:s; display:flex; flex-direction:column; gap:10px; margin:0; padding:0; list-style:none}
.steps-list li{display:grid; grid-template-columns:32px minmax(0,1fr); gap:10px; font-size:14px}
.steps-list li::before{counter-increment:s; content:counter(s); width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font:600 13px/1 var(--f-mono)}
.crm{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
@media (max-width:760px){ .crm{grid-template-columns:minmax(0,1fr)} }
.crm a{display:block; border:1px solid var(--line); border-radius:10px; padding:12px; text-decoration:none; color:var(--ink); background:var(--bg)}
.crm a:hover{border-color:var(--accent)}
.crm b{display:block} .crm span{font-size:12.5px; color:var(--muted)}
.care{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
@media (max-width:760px){ .care{grid-template-columns:minmax(0,1fr)} }
.care div{font-size:13.5px; padding:10px 12px; border-radius:10px; background:var(--warn-soft)}
.care b{color:var(--warn)}
.sec-t{font:400 32px/1 var(--f-display); letter-spacing:.02em; margin-top:10px}
.aula6{display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; align-items:center; background:var(--navy); color:var(--on-navy); border-radius:14px; padding:18px 20px}
.aula6 .t{font:400 28px/1 var(--f-display)}
.aula6 p{color:var(--on-navy-muted); font-size:14px}
.sources{font-size:12px; color:var(--muted); line-height:1.7}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:14px; font-weight:500; opacity:0; pointer-events:none; transition:all .25s; z-index:60; max-width:calc(100vw - 32px)}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
.print-only{display:none}

/* IMPRESSÃO: só a folha "GTM em 1 página" */
@media print{
  @page{size:A4; margin:10mm}
  :root{--bg:#fff; --surface:#fff; --surface-2:#F1F3FB; --ink:#0B1030; --muted:#4A5070; --line:#C9CFEA; --accent:#3F57E6; color-scheme:light}
  body{background:#fff; font-size:11px}
  .top,.trail,.toast,#stage > *:not(#print-root){display:none!important}
  .app{display:block; padding:0; max-width:none}
  #print-root{display:block!important}
  .sheet{border:0; padding:0}
  .sh{break-inside:avoid; padding:6px 9px}
  .sh-grid{gap:5px}
  .sh h4{font-size:15px; margin-bottom:3px}
  .sh .kv, .sh p, .sh li{font-size:9.5px; line-height:1.35}
  .sh .kv{grid-template-columns:96px minmax(0,1fr)}
  .sh-top{padding-bottom:6px; margin-bottom:8px} .sh-top h3{font-size:28px}
  .bignum{font-size:22px} .minibars{font-size:9px; gap:2px}
  body.blank .sh .empty{color:transparent; display:block}
  body.blank .sh dd .empty{height:2.1em; border-bottom:1px solid var(--line)}
  body.blank .sh p .empty{height:6em; background:repeating-linear-gradient(transparent 0 calc(2em - 1px), var(--line) calc(2em - 1px) 2em)}
  body.blank .sh p > b > .empty{height:2em}
  body.blank table.jt td{height:34px}
  .s4{grid-column:span 4!important} .s6{grid-column:span 6!important} .s8{grid-column:span 8!important}
  .jt-wrap{overflow:visible} table.jt{min-width:0; font-size:8.5px} table.jt th, table.jt td{padding:3px 4px}
  .print-only{display:block}
  .sh,.minibars i b,table.jt thead th,table.jt tbody th{-webkit-print-color-adjust:exact; print-color-adjust:exact}
}
</style>

function metaCalc(){
  var rec=num("m_rec"),pct=num("m_pct",1),tkt=num("m_tkt"),conv=num("m_conv"), ex=!(rec&&pct!=null&&tkt&&conv);
  if(ex){rec=300000;pct=50;tkt=5000;conv=3} else {pct=Math.min(pct,100); conv=Math.min(conv,100)}
  var mk=rec*pct/100, cm=mk/tkt, leads=cm/(conv/100), tot=rec/tkt;
  return {ex:ex,rec:rec,pct:pct,tkt:tkt,conv:conv,mk:mk,cm:cm,leads:leads,tot:tot};
}

  var o=curObj(), lv=o?o.lev.filter(function(_,i){return S.lev[o.id+i]}):[];
  var prin=MOT.filter(function(m){return S.mot[m.id]===1}).map(function(m){return m.t}), apo=MOT.filter(function(m){return S.mot[m.id]===2}).map(function(m){return m.t});
  var T=diagTotal(), st=curStage();
  function ring(r){return CH.filter(function(c){return chS(c.id)===r}).map(function(c){var i=chIdea(c.id); return c.t+(i?": "+i:"")}).join("\n")}
  var top=sortedIce().filter(function(r){return iceOf(r)&&!r.ex}).slice(0,3);
  var m=metaCalc(), mOk=!m.ex;
  var jor=blank?JDEF.map(function(t,i){return {id:String(i),t:t}}):S.jor;
  return '<div class="sheet"><div class="sh-top"><div><div class="eyebrow">GTM em 1 página</div><h3>'+(blank||!F("empresa")?"Empresa: ____________________":esc(F("empresa")))+'</h3></div><div class="meta">'+(blank?"Data: ___/___/______":"Atualizado em "+new Date().toLocaleDateString("pt-BR"))+'<br>Kit GTM na prática · PipeLovers · Aula 1</div></div><div class="sh-grid">'+
  '<div class="sh s4"><h4>Objetivo nº 1</h4><p><b>'+(blank?'<span class="empty">a definir</span>':o?o.t:'<span class="empty">a definir</span>')+'</b></p><dl class="kv" style="margin-top:6px"><dt>Alavancas</dt><dd>'+V(lv.join(", "))+'</dd><dt>Meta e prazo</dt><dd>'+V(F("obj_meta"))+'</dd></dl></div>'+
  '<div class="sh s4"><h4>Motor</h4><dl class="kv"><dt>Principal</dt><dd>'+V(prin.join(", "))+'</dd><dt>Apoio</dt><dd>'+V(apo.join(", "))+'</dd><dt>Por quê</dt><dd>'+V(F("motor_why"))+'</dd></dl></div>'+
  '<div class="sh s4"><h4>Maturidade <small>diagnóstico</small></h4>'+(blank||!T.ans?'<p><span class="empty">a definir</span></p>':'<p><span class="bignum">'+T.pct+'%</span> · '+(T.ans>=6?T.lvl.t:"incompleto")+'</p><div class="minibars" style="margin-top:6px">'+PILLARS.map(function(p){var r=pillarScore(p); return '<div><span>'+p.t+'</span><i><b style="width:'+r.pct+'%"></b></i><span>'+(r.n?r.pct+"%":"–")+'</span></div>'}).join("")+'</div>')+'</div>'+
  '<div class="sh s8"><h4>ICP <small>para quem vender</small></h4><dl class="kv">'+ICPF.map(function(x){return '<dt>'+x[1]+'</dt><dd>'+V(F(x[0]))+'</dd>'}).join("")+'</dl></div>'+
  '<div class="sh s4"><h4>Anti-ICP <small>quem evitar</small></h4><p>'+V(F("anti"))+'</p></div>'+
  '<div class="sh s12"><h4>Jornada de compra</h4><div class="jt-wrap"><table class="jt"><thead><tr><th></th>'+jor.map(function(s,i){return '<th>'+(i+1)+'. '+esc(s.t||"Etapa")+'</th>'}).join("")+'</tr></thead><tbody>'+JQ.map(function(q){return '<tr><th>'+q.t+'</th>'+jor.map(function(s){return '<td>'+(blank?'':esc(F("j"+s.id+"_"+q.k)))+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div></div>'+
  '<div class="sh s6"><h4>Canais <small>Bullseye</small></h4><dl class="kv"><dt>Momento</dt><dd>'+V(st?st.t+" → "+st.mix:"")+'</dd><dt>Funciona</dt><dd>'+V(ring(3))+'</dd><dt>Provável</dt><dd>'+V(ring(2))+'</dd><dt>Possível</dt><dd>'+V(CH.filter(function(c){return chS(c.id)===1}).map(function(c){return c.t}).join(", "))+'</dd></dl></div>'+
  '<div class="sh s6"><h4>Próximo teste <small>ICE</small></h4>'+(blank||!top.length?'<p><span class="empty">a definir</span></p>':'<ul>'+top.map(function(r){return '<li>'+esc(r.n)+' · ICE '+fmt(iceOf(r))+'</li>'}).join("")+'</ul>')+'<dl class="kv" style="margin-top:6px"><dt>Teste</dt><dd>'+V(F("test"))+'</dd><dt>Reavaliar em</dt><dd>'+V(F("review")?new Date(F("review")+"T12:00:00").toLocaleDateString("pt-BR"):"")+'</dd></dl></div>'+
  '<div class="sh s6"><h4>Meta desdobrada</h4>'+(blank||!mOk?'<dl class="kv"><dt>Receita/mês</dt><dd><span class="empty">a definir</span></dd><dt>Marketing</dt><dd><span class="empty">a definir</span></dd><dt>Vendas</dt><dd><span class="empty">a definir</span></dd></dl>':'<dl class="kv"><dt>Receita/mês</dt><dd>'+brl(m.rec)+' · ticket '+brl(m.tkt)+'</dd><dt>Marketing</dt><dd><b>'+Math.ceil(m.leads).toLocaleString("pt-BR")+' leads do ICP/mês</b> ('+m.pct.toLocaleString("pt-BR")+'% da receita, conversão '+m.conv.toLocaleString("pt-BR")+'%)</dd><dt>Vendas</dt><dd><b>'+r1(m.tot)+' clientes/mês</b>, '+r1(m.tot-m.cm)+' de prospecção própria</dd></dl>')+'</div>'+
  '<div class="sh s6"><h4>Alinhamento</h4><dl class="kv"><dt>MQL</dt><dd>'+V(F("g_mql"))+'</dd><dt>SQL</dt><dd>'+V(F("g_sql"))+'</dd><dt>SLA</dt><dd>'+V(F("sla"))+'</dd><dt>Métricas</dt><dd>'+V(F("kpi"))+'</dd></dl></div>'+
  '</div></div>';
}

/* ================= PROMPTS DINÂMICOS ================= */
function diagPrompt(){
  var L="Você é especialista em go-to-market e Revenue Operations B2B. Fiz um diagnóstico de maturidade do GTM da minha empresa (Sim = 2, Em parte = 1, Não = 0). Respostas:\n";
  PILLARS.forEach(function(p){var r=pillarScore(p); L+="\n"+p.t.toUpperCase()+" ("+(r.n?r.s+"/8":"sem resposta")+")\n"; p.qs.forEach(function(q,i){var v=S.diag[p.id+i]; L+="- "+q+" → "+(v===2?"Sim":v===1?"Em parte":v===0?"Não":"não respondi")+"\n"})});
  return L+"\nCom base nisso:\n1. Aponte os 3 pontos mais frágeis e por que eles travam o crescimento.\n2. Monte um plano de 30 dias, semana a semana, com responsável (Vendas, Marketing ou CS) para cada ação.\n3. Diga quais dados eu preciso levantar no CRM para começar.\nSeja prático. Se faltar contexto sobre a empresa, pergunte antes.";
}
function jorPrompt(){var et=S.jor.map(function(s){return (s.t||"etapa sem nome").toLowerCase()}); var e=et.length>1?et.slice(0,-1).join(", ")+" e "+et[et.length-1]:et.join(""); return P_JOR.replace("{etapas}",e)}
function motPrompt(){var o=curObj(); var mot=MOT.filter(function(m){return S.mot[m.id]}).map(function(m){return m.t+" ("+MOT_ST[S.mot[m.id]].toLowerCase()+")"}).join(", "); var icp=["icp_firmo","icp_comp","icp_dor"].map(F).filter(Boolean).join("; ");
  return P_MOT.replace("{obj}",o?o.t:"[preencha]").replace("{icp}",icp||"[preencha]").replace("{tkt}",num("m_tkt")?brl(num("m_tkt")):"[preencha]").replace("{mot}",mot||"[preencha]")}
function aliPrompt(){return P_ALI.replace("{mql}",F("g_mql")||"[preencha]").replace("{sql}",F("g_sql")||"[preencha]").replace("{sla}",F("sla")||"[preencha]")}
function canaisPrompt(){
  var st=curStage();
  var L="Você é especialista em aquisição B2B e conhece o método Bullseye do livro Traction.\n\nMomento da empresa: "+(st?st.t+" (mix sugerido: "+st.mix+")":"[preencha]")+"\nICP: "+(["icp_firmo","icp_dor","icp_gat"].map(F).filter(Boolean).join("; ")||"[preencha]")+"\n\nMeu Bullseye hoje:\n";
  RINGS.slice().reverse().forEach(function(x){var l=CH.filter(function(c){return chS(c.id)===x.r}).map(function(c){var i=chIdea(c.id); return c.t+(i?" ("+i+")":"")}); L+="- "+x.t+": "+(l.join("; ")||"nenhum")+"\n"});
  L+="\nMinhas ideias com ICE (Impacto, Confiança, Facilidade):\n"+sortedIce().map(function(r){return "- "+(r.n||"sem nome")+(r.ex?" [exemplo da aula]":"")+": I "+(r.i||"?")+", C "+(r.c||"?")+", E "+(r.e||"?")+" → ICE "+fmt(iceOf(r))}).join("\n");
  return L+"\n\n1. Sugira uma ideia de ação para cada um dos 19 canais do Traction pensando no meu ICP.\n2. Critique as minhas notas de ICE: onde estou otimista ou pessimista demais?\n3. Desenhe o teste de 30 dias da ideia que ficou em primeiro: meta, métrica, orçamento estimado e critério para escalar ou cortar.";
}
function refreshPrompt(id,text){var el=$("#pt-"+id); if(el) el.textContent=text}

/* ================= RENDER ================= */
function bindFields(root){$$("[data-k]",root).forEach(function(el){var k=el.dataset.k; el.value=S.f[k]!=null?S.f[k]:""})}
function renderTrail(){
  var g="", h="";
  STEPS.forEach(function(s,i){
    if(s.g!==g){g=s.g; h+='<li class="group">'+g+'</li>'}
    var st=state(i);
    h+='<li><button type="button" data-go="'+i+'" '+(i===S.step?'aria-current="step"':'')+'><span class="num">'+(i===LAST?"★":i)+'</span><span>'+s.t+'</span><span class="st s'+st+'" aria-label="'+(st===2?"completo":st===1?"começado":"")+'"></span></button></li>';
  });
  $("#trail-list").innerHTML=h;
  $("#trail-now").innerHTML='<b>Passo '+S.step+' de '+LAST+'</b> · '+STEPS[S.step].t;
  $("#topbar").style.width=Math.round(S.step/LAST*100)+"%";
}
function nav(){
  var i=S.step, back="", next="";
  if(i===1&&S.dpg>0) back='<button class="btn ghost" data-nav="-1">← '+(S.dpg===6?"Voltar às perguntas":"Bloco anterior")+'</button>';
  else if(i>0) back='<button class="btn ghost" data-nav="-1">← Voltar</button>';
  else back='<span></span>';
  if(i===1&&S.dpg<5) next='<button class="btn primary" data-nav="1">Próximo bloco: '+PILLARS[S.dpg+1].t+' →</button>';
  else if(i===1&&S.dpg===5) next='<button class="btn primary" data-nav="1">Ver resultado →</button>';
  else if(i===0) next='<button class="btn primary big" data-nav="1">Começar →</button>';
  else if(i<LAST) next='<button class="btn primary" data-nav="1">Próximo: '+STEPS[i+1].t+' →</button>';
  else next='<button class="btn" data-go="0">Voltar ao início</button>';
  return '<div class="s-nav">'+back+'<span class="saved">Salvo neste navegador</span>'+next+'</div>';
}
function render(focus){
  var i=S.step;
  $("#stage").innerHTML='<div class="card">'+R[i]()+nav()+'</div>';
  bindFields($("#stage"));
  if(i===7) drawTarget();
  if(i===9) calc();
  renderTrail();
  if(focus){window.scrollTo(0,0); try{$("#stage").focus({preventScroll:true})}catch(e){}}
}
function go(i){
  i=Math.max(0,Math.min(LAST,+i||0));
  if(i===1&&S.step!==1&&Object.keys(S.diag).length>=24) S.dpg=6;
  S.step=i; save();
  $("#trail").classList.remove("open"); $("#trail-toggle").setAttribute("aria-expanded","false");
  if(location.hash!=="#p"+i){try{history.pushState(null,"","#p"+i)}catch(e){}}
  render(true);
}
window.addEventListener("popstate",function(){var m=/^#p(\d+)$/.exec(location.hash); if(m){S.step=Math.min(LAST,+m[1]); save(); render(true);}});

/* ================= INTERAÇÕES ================= */
document.addEventListener("click",function(e){
  var t=e.target, b;
  if((b=t.closest("[data-go]"))){go(+b.dataset.go); return;}
  if((b=t.closest("[data-nav]"))){var d=+b.dataset.nav;
    if(S.step===1&&((d>0&&S.dpg<6)||(d<0&&S.dpg>0))){S.dpg+=d; save(); render(true); return;}
    go(S.step+d); return;}
  if((b=t.closest("[data-dpg]"))){S.dpg=+b.dataset.dpg; save(); render(); return;}
  if((b=t.closest("button[data-q]"))){var q=b.dataset.q, v=+b.dataset.v; if(S.diag[q]===v) delete S.diag[q]; else S.diag[q]=v; save();
    $$('button[data-q="'+q+'"]').forEach(function(x){x.setAttribute("aria-pressed",String(S.diag[q])===x.dataset.v)});
    var p=PILLARS[S.dpg]; if(p){var pill=$('.pill[data-dpg="'+S.dpg+'"] .c'); if(pill) pill.textContent=pillarScore(p).n+"/4";} renderTrail(); return;}
  if((b=t.closest("[data-obj]"))){S.obj=S.obj===b.dataset.obj?"":b.dataset.obj; save(); render(); return;}
  if((b=t.closest("[data-st]"))){S.stage=S.stage===b.dataset.st?"":b.dataset.st; save(); render(); return;}
  if(t.closest("#ch-all")){S.allch=S.allch?0:1; save(); render(); return;}
  if((b=t.closest("button[data-c]"))){var id=b.dataset.c, r=+b.dataset.r; S.ch[id]=S.ch[id]||{}; S.ch[id].r=S.ch[id].r===r?0:r; save();
    $$('button[data-c="'+id+'"]').forEach(function(x){x.setAttribute("aria-pressed",+x.dataset.r===S.ch[id].r)}); drawTarget(); renderTrail(); return;}
  if((b=t.closest("[data-pset]"))){S.pt[b.dataset.pset]=+b.dataset.pi; save(); render(); return;}
  if((b=t.closest("[data-tool]"))){S.tool=+b.dataset.tool; save(); render(); return;}
  if((b=t.closest("[data-cmd]"))){copy(CMDS[+b.dataset.cmd]); return;}
  if((b=t.closest("[data-copy-el]"))){var el=document.getElementById(b.dataset.copyEl); if(el) copy(el.textContent,b); return;}
  /* jornada */
  if((b=t.closest("[data-j]"))){S.jst=b.dataset.j; save(); render(); return;}
  if(t.closest("#jor-add")){var nid="n"+Date.now().toString(36); S.jor.push({id:nid,t:"Nova etapa"}); S.jst=nid; save(); render(); var jn=$("#jn"); if(jn){jn.focus(); jn.select()} toast("Etapa adicionada. Dê um nome a ela."); return;}
  if((b=t.closest("[data-jm]"))&&!b.disabled){var a=jIdx(S.jst), z=a+(+b.dataset.jm); if(z<0||z>=S.jor.length) return; var tmp=S.jor[a]; S.jor[a]=S.jor[z]; S.jor[z]=tmp; save(); render(); return;}
  if((b=t.closest("#jor-del"))&&!b.disabled){
    if(b.classList.contains("armed")){var di=jIdx(S.jst), did=S.jst; S.jor.splice(di,1); JQ.forEach(function(q){delete S.f["j"+did+"_"+q.k]}); S.jst=S.jor[Math.max(0,di-1)].id; save(); render(); toast("Etapa excluída."); }
    else{b.classList.add("armed"); b.textContent="Toque de novo para excluir"; setTimeout(function(){if(b.isConnected){b.classList.remove("armed"); b.textContent="Excluir etapa"}},4000);} return;}
  if((b=t.closest("#jor-reset"))){
    if(b.classList.contains("armed")){S.jor.forEach(function(st){if(!/^[0-5]$/.test(st.id)) JQ.forEach(function(q){delete S.f["j"+st.id+"_"+q.k]})}); S.jor=null; S.jst="0"; jorInit(); save(); render(); toast("A jornada voltou para as 6 etapas sugeridas.");}
    else{b.classList.add("armed"); b.textContent="Toque de novo: etapas novas serão apagadas"; setTimeout(function(){if(b.isConnected){b.classList.remove("armed"); b.textContent="Voltar para as 6 etapas sugeridas"}},4000);} return;}
  /* ICE */
  if((b=t.closest("[data-del]"))){S.ice.splice(+b.dataset.del,1); save(); render(); return;}
  if(t.closest("#ice-add")){S.ice.push({n:"",i:"",c:"",e:""}); save(); render(); var ln=$("#ice-n-"+(S.ice.length-1)); if(ln) ln.focus(); return;}
  if(t.closest("#ice-sort")){S.ice=sortedIce(); save(); render(); toast("Ideias ordenadas: a primeira é o próximo teste."); return;}
  if(t.closest("#ice-clear")){S.ice=S.ice.filter(function(r){return !r.ex}); save(); render(); return;}
  if(t.closest("#ice-from-b")){var have=S.ice.map(function(r){return r.n}), add=0;
    CH.forEach(function(c){if(chS(c.id)===2){var nm=c.t+(chIdea(c.id)?": "+chIdea(c.id):""); if(have.indexOf(nm)<0){S.ice.push({n:nm,i:"",c:"",e:""}); add++}}});
    if(add) S.ice=S.ice.filter(function(r){return !r.ex}); save(); render(); toast(add?add+" ideia(s) adicionada(s). Agora dê as notas.":"Marque canais como Provável no passo 7 primeiro."); return;}
});
document.addEventListener("input",function(e){
  var el=e.target, d=el.dataset||{};
  if(d.k){S.f[d.k]=el.value; save(); renderTrail();
    if(/^m_/.test(d.k)) calc();
    if(/^j/.test(d.k)){var tb=$('#jor-tabs [data-j="'+S.jst+'"] .dot'); var n=jFill(S.jst); if(tb) tb.className="dot "+(n===6?"full":n?"half":"");}
    if(S.step===6) refreshPrompt("mot",motPrompt());
    if(S.step===9) refreshPrompt("ali",aliPrompt());
    return;}
  if(d.jn){var st=S.jor[jIdx(d.jn)]; st.t=el.value; var tab=$('#jor-tabs [data-j="'+d.jn+'"] .jt'); if(tab) tab.textContent=(jIdx(d.jn)+1)+". "+(st.t||"Etapa sem nome"); save(); refreshPrompt("jor",jorPrompt()); return;}
  if(d.ci){S.ch[d.ci]=S.ch[d.ci]||{}; S.ch[d.ci].idea=el.value; save(); return;}
  if(d.ice!=null){var i=+d.ice, f=d.f, v=el.value;
    if(f!=="n") v=v===""?"":Math.max(1,Math.min(10,Math.round(+v)||1));
    S.ice[i][f]=v; if(S.ice[i].ex){delete S.ice[i].ex; var tag=el.closest("td").parentNode.querySelector(".hint"); if(tag) tag.remove();}
    $("#ice-s-"+i).textContent=fmt(iceOf(S.ice[i])); save(); markFirst(); refreshPrompt("can",canaisPrompt()); renderTrail(); return;}
});
document.addEventListener("change",function(e){
  var el=e.target, d=el.dataset||{};
  if(d.ice!=null&&d.f!=="n"){el.value=S.ice[+d.ice][d.f]; return;}
  if(d.lev){if(el.checked) S.lev[d.lev]=1; else delete S.lev[d.lev]; save(); return;}
  if(d.a!=null){if(el.checked) S.acts[d.a]=1; else delete S.acts[d.a]; save(); return;}
  if(d.mot){var s=+el.value, moved="";
    if(s===1){for(var k in S.mot){if(S.mot[k]===1&&k!==d.mot){S.mot[k]=2; moved=MOT.filter(function(m){return m.id===k})[0].t}}}
    if(s) S.mot[d.mot]=s; else delete S.mot[d.mot]; save(); render();
    if(moved) toast(moved+" passou para apoio. Só um motor pode ser o principal."); return;}
});
function markFirst(){var best=-1,bi=-1; S.ice.forEach(function(r,i){var v=iceOf(r); if(v>best){best=v;bi=i}}); $$("#ice-body tr").forEach(function(tr,i){tr.classList.toggle("first",i===bi&&best>0)})}
function calc(){
  var m=metaCalc(), out=$("#calc-out"); if(!out) return;
  out.innerHTML='<div><div class="lab">Meta do Marketing</div><div class="big">'+Math.ceil(m.leads).toLocaleString("pt-BR")+' leads</div><div class="lab">do ICP por mês: '+brl(m.mk)+' ÷ '+brl(m.tkt)+' = '+r1(m.cm)+' clientes ÷ '+m.conv.toLocaleString("pt-BR")+'%</div></div>'+
   '<div><div class="lab">Meta de Vendas</div><div class="big">'+r1(m.tot)+' clientes</div><div class="lab">por mês ('+brl(m.rec)+'), sendo '+r1(m.tot-m.cm)+' de prospecção própria</div></div>';
  $("#calc-note").textContent=m.ex?"Mostrando o exemplo da aula (números fictícios). Preencha os 4 campos para calcular a sua meta. Fórmula: HubSpot.":"A conversão de lead em cliente depende das duas áreas, então essa meta é compartilhada. Fórmula: HubSpot.";
}
function drawTarget(){
  var svgEl=$("#target"); if(!svgEl) return;
  var by={1:[],2:[],3:[]}; CH.forEach(function(c){var r=chS(c.id); if(r) by[r].push(c)});
  var svg='<circle cx="150" cy="150" r="140" fill="var(--ring-1)"/><circle cx="150" cy="150" r="94" fill="var(--ring-2)"/><circle cx="150" cy="150" r="48" fill="var(--ring-3)"/>'+
   '<text x="150" y="34" text-anchor="middle" fill="var(--ink)" style="font:600 11px var(--f-body);letter-spacing:.1em">POSSÍVEL · '+by[1].length+'</text>'+
   '<text x="150" y="84" text-anchor="middle" fill="#FFFFFF" style="font:600 11px var(--f-body);letter-spacing:.1em">PROVÁVEL · '+by[2].length+'</text>'+
   '<text x="150" y="146" text-anchor="middle" fill="var(--on-accent)" style="font:400 22px var(--f-display)">'+by[3].length+'</text>'+
   '<text x="150" y="164" text-anchor="middle" fill="var(--on-accent)" style="font:600 10px var(--f-body);letter-spacing:.1em">FUNCIONA</text>';
  function dots(list,rad,col){var n=list.length; return list.map(function(c,i){var a=(-60+300*(i+0.5)/Math.max(n,1))*Math.PI/180; return '<circle cx="'+(150+rad*Math.cos(a)).toFixed(1)+'" cy="'+(150+rad*Math.sin(a)).toFixed(1)+'" r="6" fill="'+col+'" stroke="var(--surface)" stroke-width="2"><title>'+esc(c.t)+'</title></circle>'}).join("")}
  svgEl.innerHTML=svg+dots(by[1],117,"var(--accent)")+dots(by[2],71,"var(--surface)");
  var w2=by[2].length>3?'<div class="warn">A aula sugere 2 ou 3 canais em Provável. Você tem '+by[2].length+'.</div>':"";
  var w3=by[3].length>1?'<div class="warn">Foco total: tente deixar só 1 canal em Funciona.</div>':"";
  $("#rings-list").innerHTML=[3,2,1].map(function(r){var sw=["","var(--ring-1)","var(--ring-2)","var(--ring-3)"][r]; return '<div><div class="h"><span class="sw" style="background:'+sw+'"></span>'+RINGS[r-1].t+' ('+by[r].length+')</div><div class="v">'+(by[r].map(function(c){return c.t}).join(", ")||"nenhum ainda")+'</div>'+(r===2?w2:r===3?w3:"")+'</div>'}).join("");
}

/* ================= COPIAR / EXPORTAR ================= */
function copy(text,btn){
  function ok(){toast("Copiado. Agora é só colar na IA."); if(btn){var o=btn.textContent; btn.textContent="Copiado"; setTimeout(function(){if(btn.isConnected) btn.textContent=o},1500)}}
  function fallback(){var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); var s=false; try{s=document.execCommand("copy")}catch(e){} document.body.removeChild(ta); if(s) ok(); else toast("Não consegui copiar. Selecione o texto e use Ctrl+C.");}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok,fallback)} else fallback();
}
function dl(name,text,type){try{var blob=new Blob([text],{type:type}); var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove()},500); toast("Arquivo gerado: "+name);}catch(e){toast("O download foi bloqueado neste ambiente.")}}
function md(){
  function v(x){x=(x||"").trim(); return x||"_a definir_"}
  var o=curObj(), st=curStage(), m=metaCalc(), T=diagTotal();
  var t="# GTM da "+empresa()+"\nGerado pelo Kit GTM na prática (PipeLovers, Aula 1) em "+new Date().toLocaleDateString("pt-BR")+".\n\n";
  t+="## 1. Objetivo nº 1\n"+(o?o.t:"_a definir_")+"\n"; if(o){var lv=o.lev.filter(function(_,i){return S.lev[o.id+i]}); if(lv.length) t+="Alavancas: "+lv.join(", ")+"\n";}
  t+="Meta e prazo: "+v(F("obj_meta"))+"\n\n## 2. ICP\n"+ICPF.map(function(x){return "- "+x[1]+": "+v(F(x[0]))}).join("\n")+"\n\n## 3. Anti-ICP\n"+v(F("anti"))+"\n\n## 4. Jornada de compra\n";
  S.jor.forEach(function(s,i){t+="\n### "+(i+1)+". "+(s.t||"Etapa sem nome")+"\n"; JQ.forEach(function(q){t+="- "+q.t+" "+v(F("j"+s.id+"_"+q.k))+"\n"})});
  t+="\n## 5. Motor de crescimento\n"+(MOT.filter(function(x){return S.mot[x.id]}).map(function(x){return "- "+x.t+": "+MOT_ST[S.mot[x.id]].toLowerCase()}).join("\n")||"_a definir_")+"\nPor quê: "+v(F("motor_why"))+"\n\n";
  t+="## 6. Canais\nMomento: "+(st?st.t+" (mix: "+st.mix+")":"_a definir_")+"\n";
  RINGS.slice().reverse().forEach(function(x){var l=CH.filter(function(c){return chS(c.id)===x.r}); t+="\n**"+x.t+"**\n"+(l.map(function(c){return "- "+c.t+(chIdea(c.id)?": "+chIdea(c.id):"")}).join("\n")||"- nenhum")+"\n"});
  t+="\n## 7. Primeiro teste (ICE)\n| Ideia | I | C | E | ICE |\n|---|---|---|---|---|\n"+sortedIce().map(function(r){return "| "+(r.n||"")+(r.ex?" (exemplo da aula)":"")+" | "+(r.i||"")+" | "+(r.c||"")+" | "+(r.e||"")+" | "+fmt(iceOf(r))+" |"}).join("\n")+"\n\nTeste: "+v(F("test"))+"\nReavaliar em: "+v(F("review"))+"\n\n";
  t+="## 8. Metas e alinhamento\n"+(m.ex?"Meta desdobrada: _a definir_\n":"Meta de receita: "+brl(m.rec)+"/mês\nMarketing: "+Math.ceil(m.leads).toLocaleString("pt-BR")+" leads do ICP/mês\nVendas: "+r1(m.tot)+" clientes/mês ("+r1(m.tot-m.cm)+" de prospecção própria)\n")+"\n- MQL: "+v(F("g_mql"))+"\n- SQL: "+v(F("g_sql"))+"\n- SLA: "+v(F("sla"))+"\n- Métricas semanais: "+v(F("kpi"))+"\n\n### Glossário da aula\n"+GLOSS.map(function(g){return "- **"+g[0]+"**: "+g[1]}).join("\n")+"\n\n";
  t+="## Diagnóstico de maturidade\n"+(T.ans?T.pct+"% ("+(T.ans>=6?T.lvl.t:"incompleto")+")\n":"")+PILLARS.map(function(p){var r=pillarScore(p); return "- "+p.t+": "+(r.n?r.pct+"% ("+r.n+"/4 respondidas)":"não respondido")}).join("\n")+"\n";
  return t;
}
function printSheet(blank){
  var root=$("#print-root");
  if(!root){root=document.createElement("div"); root.id="print-root"; root.className="print-only"; $("#stage").appendChild(root);}
  root.innerHTML=sheet(blank); document.body.classList.toggle("blank",!!blank);
  setTimeout(function(){window.print(); setTimeout(function(){document.body.classList.remove("blank"); root.remove();},400)},60);
}
window.addEventListener("beforeprint",function(){if(!$("#print-root")){var r=document.createElement("div"); r.id="print-root"; r.className="print-only"; r.innerHTML=sheet(false); $("#stage").appendChild(r);}});
window.addEventListener("afterprint",function(){var r=$("#print-root"); if(r&&!document.body.classList.contains("blank")) r.remove();});

var dlBtn=$("#dl-btn"), dlMenu=$("#dl-menu");
dlBtn.addEventListener("click",function(e){e.stopPropagation(); dlMenu.hidden=!dlMenu.hidden; dlBtn.setAttribute("aria-expanded",!dlMenu.hidden)});
document.addEventListener("click",function(e){if(!e.target.closest(".menu")){dlMenu.hidden=true; dlBtn.setAttribute("aria-expanded","false")}});
var resetArm=0;
document.addEventListener("click",function(e){var b=e.target.closest("[data-act]"); if(!b) return; var a=b.dataset.act;
  if(a!=="reset") dlMenu.hidden=true;
  if(a==="print") printSheet(false);
  else if(a==="print-blank") printSheet(true);
  else if(a==="md") dl("meu-gtm.md",md(),"text/markdown;charset=utf-8");
  else if(a==="json") dl("kit-gtm-respostas.json",JSON.stringify(S,null,2),"application/json");
  else if(a==="import") $("#import-file").click();
  else if(a==="reset"){
    if(Date.now()-resetArm<4000){try{localStorage.removeItem(KEY)}catch(x){} location.hash=""; location.reload();}
    else{resetArm=Date.now(); b.innerHTML='Toque de novo para confirmar<small>Isso apaga todas as respostas deste navegador</small>';}
  }
});
$("#import-file").addEventListener("change",function(e){var f=e.target.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){try{var o=JSON.parse(r.result); if(!o||typeof o!=="object"||!o.f) throw 0; for(var k in o) S[k]=o[k]; if(!Array.isArray(S.ice)) S.ice=[]; jorInit(); save(); render(true); toast("Respostas carregadas.")}catch(x){toast("Esse arquivo não é um backup do Kit GTM.")}}; r.readAsText(f); e.target.value="";});
document.addEventListener("toggle",function(e){var d=e.target; if(d.dataset&&d.dataset.key) OPEN[d.dataset.key]=d.open;},true);
$("#trail-toggle").addEventListener("click",function(){var tr=$("#trail"); tr.classList.toggle("open"); this.setAttribute("aria-expanded",tr.classList.contains("open"))});

/* ================= INÍCIO ================= */
var hm=/^#p(\d+)$/.exec(location.hash); if(hm) S.step=Math.min(LAST,+hm[1]);
if(typeof S.step!=="number"||S.step<0||S.step>LAST) S.step=0;
render(false);
})();
